<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b243b"><title>الأرشيف الإلكتروني | مدرسة أم المؤمنين</title>
<style>
:root{--navy:#0b243b;--navy2:#173854;--teal:#0b9c96;--bg:#f2f5f8;--text:#172c3c;--muted:#617484;--line:#dfe7ec;--red:#cf4350;--green:#18866c;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--teal)}.hidden{display:none!important}.center{text-align:center}.muted{color:var(--muted)}.small{font-size:12px}.red{color:var(--red)}.ok{color:var(--green)}.nowrap{white-space:nowrap}.shell{max-width:1160px;margin:auto;padding:20px}.top{background:var(--navy);color:#fff}.topinner{max-width:1160px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:18px}.brand small{display:block;color:#b6d3dc;font-weight:normal;font-size:12px}.nav{display:flex;gap:8px;padding-top:15px;overflow-x:auto}.nav button{padding:10px 16px;background:#e7eef3;color:var(--navy);border-radius:11px 11px 0 0;font-weight:700;white-space:nowrap}.nav button.on{background:var(--teal);color:white}.btn{border-radius:10px;padding:9px 15px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:40px}.primary{background:var(--teal);color:#fff}.secondary{background:#e7eff4;color:var(--navy)}.danger{background:#fff0f0;color:#ab273c}.dark{background:var(--navy);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--navy)}.sm{font-size:12px;padding:6px 10px;min-height:32px}.full{width:100%}.card{background:white;border-radius:16px;border:1px solid var(--line);padding:18px;margin-bottom:16px;box-shadow:0 3px 11px #18364f08}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.section-title{font-size:20px;font-weight:800;margin:5px 0 14px}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{border-radius:13px;padding:18px;background:white;border:1px solid var(--line)}.stat strong{font-size:29px;display:block;color:var(--navy);line-height:1.3}.stat span{color:var(--muted);font-size:13px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-weight:700}.field input,.field select,.search{width:100%;border:1px solid #cbd7e0;border-radius:10px;padding:11px 13px;outline-color:var(--teal);background:white;min-height:42px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.list{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{background:#edf3f7;color:#4b6475;text-align:right;font-size:12px}.table td,.table th{padding:11px;border-bottom:1px solid var(--line)}.table tr:hover td{background:#f8fbfc}.tag{display:inline-block;padding:3px 10px;border-radius:30px;background:#e5f5f1;color:var(--green);font-weight:700;font-size:12px}.tag.bad{background:#fff3e5;color:#b96d23}.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.doc{border:1px solid var(--line);background:#fbfdfe;border-radius:12px;padding:14px}.doc.ready{border-color:#93d6c7;background:#f6fdfb}.doc-title{font-weight:800;margin-bottom:5px}.doc p{margin:4px 0 10px}.progress{height:9px;background:#dfe9ef;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--teal);transition:width .3s}.login{max-width:420px;margin:8vh auto 0;padding:24px}.login .logo{font-size:44px}.login h1{font-size:23px;margin:5px 0}.overlay{position:fixed;inset:0;background:#071b2c99;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}.modal{background:white;border-radius:18px;width:min(740px,100%);max-height:94dvh;overflow:auto;padding:20px;box-shadow:0 20px 70px #0014}.toast{position:fixed;bottom:20px;left:20px;right:20px;max-width:540px;margin:auto;background:var(--navy);color:#fff;border-radius:12px;padding:15px;z-index:50;box-shadow:0 8px 30px #0003}.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.thumb{width:125px;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;background:#f3f7fa}.thumb img{max-width:105px;height:130px;width:100%;object-fit:contain;background:#e0e6eb}.thumb button{margin-top:5px}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff7;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.foot{text-align:center;padding:16px;color:var(--muted);font-size:11px}.actionrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.rowcard{padding:12px 0;border-bottom:1px solid var(--line)}.rowcard:last-child{border:0}.arrow{font-size:22px;color:var(--teal)}@media(max-width:750px){.statgrid{grid-template-columns:repeat(2,1fr)}.docgrid,.grid2,.grid3{grid-template-columns:1fr}.brand{font-size:15px}.topinner{padding:10px 12px}.shell{padding:12px}.card{padding:14px}.section-title{font-size:18px}.doc .btn{flex:1}.login{margin:7vh 10px}.nav button{padding:10px 12px}}
</style>
</head>
<body>
<div id="loginScreen" class="shell hidden"><div class="login card center"><div class="logo">🗂️</div><h1>أرشيف شؤون المعلمين</h1><p class="muted">مدرسة أم المؤمنين للتعليم الأساسي</p><form id="loginForm" style="text-align:right"><div class="field"><label>اسم المستخدم</label><input name="username" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input type="password" name="password" autocomplete="current-password" required></div><br><button class="btn primary full" type="submit">دخول المنظومة</button></form><p class="small muted">حسابات المستخدمين ينشئها المسؤول فقط</p></div></div>
<div id="mainScreen" class="hidden"><header class="top"><div class="topinner"><div class="brand">🗂️ أرشيف المعلمين<small>مدرسة أم المؤمنين للتعليم الأساسي</small></div><div class="flex"><span id="who" class="small"></span><button class="btn sm outline" onclick="logout()">خروج</button></div></div></header><main class="shell"><div class="nav"><button data-tab="home" class="on" onclick="tab('home')">الرئيسية</button><button data-tab="teachers" onclick="tab('teachers')">المعلمون والأرشيف</button><button data-tab="users" id="navUsers" onclick="tab('users')">المستخدمون</button><button data-tab="exports" onclick="tab('exports')">التصدير</button></div><div id="view" style="margin-top:16px"></div></main><footer class="foot">الأرشيف الإلكتروني — المستندات خاصة ولا تظهر إلا للمستخدمين المصرّح لهم</footer></div>
<div id="modalLayer" class="overlay hidden"><div class="modal"><div class="between"><h2 id="modalTitle" style="margin:0"></h2><button class="btn sm secondary" onclick="closeModal()">✕ إغلاق</button></div><div id="modalBody" style="margin-top:14px"></div></div></div>
<div id="toast" class="toast hidden"></div>
<input id="camera" type="file" accept="image/*" capture="environment" class="hidden" onchange="picked(event)">
<input id="gallery" type="file" accept="image/*" multiple class="hidden" onchange="picked(event)">
<input id="excel" type="file" accept=".xlsx,.csv" class="hidden" onchange="importExcel(event)">
<script>
let user=null,csrf='',teachers=[],docs=[],logs=[],users=[],activeTab='home',pickedTeacher=null,pending=[],targetKind='',targetMode='append',targetPage=null,busy=false,searchText='';
const kinds={start:'مباشرة العمل',appointment:'قرار التعيين',birth:'شهادة الميلاد',service:'استمرارية العمل',qualification:'المؤهل العلمي'};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg,err=false){let n=el('toast');n.textContent=msg;n.style.background=err?'#922538':'#0b243b';n.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.add('hidden'),5000)}
async function api(url,opt={}){let headers=opt.headers||{};if(!(opt.body instanceof FormData)&&opt.body)headers['Content-Type']='application/json';if(opt.method&&opt.method!=='GET')headers['X-CSRF-Token']=csrf;let response=await fetch(url,{credentials:'same-origin',...opt,headers});let data=await response.json().catch(()=>({}));if(!response.ok){if(response.status===401){user=null;showLogin()}throw Error(data.error||`فشل الطلب (${response.status})`)}return data}
async function boot(){try{let x=await api('/api/me');user=x.user;csrf=x.csrf;showMain();await refresh()}catch(e){showLogin()}}
function showLogin(){el('loginScreen').classList.remove('hidden');el('mainScreen').classList.add('hidden')}
function showMain(){el('loginScreen').classList.add('hidden');el('mainScreen').classList.remove('hidden');el('who').textContent=user.full_name;el('navUsers').classList.toggle('hidden',user.role!=='admin');if(user.role!=='admin'&&activeTab==='users')activeTab='home'}
el('loginForm').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api('/api/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});user=x.user;csrf=x.csrf;showMain();await refresh();notify('تم تسجيل الدخول')}catch(err){notify(err.message,true)}});
async function logout(){try{await api('/api/logout',{method:'POST'})}catch(e){}csrf='';user=null;showLogin()}
async function refresh(){let x=await api('/api/state');teachers=x.teachers;docs=x.documents;logs=x.logs;users=x.users;render()}
function docFor(t,k){return docs.find(d=>d.teacher_id===t&&d.kind===k)}
function filled(t){return Object.keys(kinds).filter(k=>docFor(t,k)).length}
function tab(t){activeTab=t;pickedTeacher=null;searchText='';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render()}
function render(){if(!user)return;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===activeTab));if(activeTab==='home')renderHome();if(activeTab==='teachers')renderTeachers();if(activeTab==='users')renderUsers();if(activeTab==='exports')renderExports()}
function renderHome(){let done=teachers.filter(t=>filled(t.id)===5).length;let count=docs.length;let latest=logs.slice(0,14).map(l=>`<div class="rowcard"><b>${esc(l.action)}</b> <span class="muted small">— ${esc(l.actor_name||'النظام')}</span><div class="small muted">${esc(l.details||'')} • ${date(l.created_at)}</div></div>`).join('')||'<p class="muted">لا توجد عمليات بعد.</p>';el('view').innerHTML=`<h2 class="section-title">لوحة المتابعة</h2><div class="statgrid"><div class="stat"><strong>${teachers.length}</strong><span>إجمالي المعلمين</span></div><div class="stat"><strong>${done}</strong><span>ملفات مكتملة</span></div><div class="stat"><strong>${teachers.length-done}</strong><span>ملفات غير مكتملة</span></div><div class="stat"><strong>${count}</strong><span>مستندات PDF محفوظة</span></div></div><div class="grid2" style="margin-top:16px"><div class="card"><h3>التصوير السريع</h3><p class="muted">اختَر المعلم ثم اضغط تصوير بجوار المستند المطلوب.</p><button class="btn primary" onclick="tab('teachers')">فتح قائمة المعلمين ←</button></div><div class="card"><h3>آخر عمليات المستخدمين</h3>${latest}</div></div>`}
function renderTeachers(){if(pickedTeacher){renderTeacherDetails();return}let list=filteredTeachers();let rows=list.slice(0,100).map(t=>{let n=filled(t.id);return `<tr><td><b>${esc(t.full_name)}</b><div class="small muted">${esc(t.national_id)}</div></td><td>${esc(t.position)}</td><td><span class="tag ${n<5?'bad':''}">${n}/5 ${n===5?'مكتمل':'غير مكتمل'}</span></td><td><button class="btn sm primary" onclick="openTeacher('${t.id}')">فتح الملف</button></td></tr>`}).join('');el('view').innerHTML=`<div class="between"><h2 class="section-title">أرشيف المعلمين</h2><div class="flex">${user.role!=='viewer'?'<button class="btn primary" onclick="addTeacherModal()">+ إضافة معلم</button>':''}${user.role==='admin'?'<button class="btn secondary" onclick="el(\'excel\').click()">استيراد Excel</button>':''}</div></div><div class="card"><div class="grid2"><div class="field"><label>بحث باسم المعلم أو الرقم الوطني أو الوظيفة</label><input id="search" class="search" value="${esc(searchText)}" placeholder="اكتب جزءًا من الاسم أو الرقم الوطني" oninput="searchText=this.value;renderTeacherTable()"></div><div class="field"><label>فلترة</label><select id="filter" onchange="renderTeacherTable()"><option value="all">الكل</option><option value="complete">المكتمل</option><option value="incomplete">الناقص</option><option value="empty">لم يُصوَّر بعد</option></select></div></div><p id="matchCount" class="small muted">النتائج: ${list.length} (عرض أول 100)</p><div class="list"><table class="table"><thead><tr><th>المعلم والرقم الوطني</th><th>الوظيفة</th><th>الأرشفة</th><th>فتح</th></tr></thead><tbody id="teacherRows">${rows||'<tr><td colspan="4">لا توجد نتائج</td></tr>'}</tbody></table></div><p class="small muted">يمكنك تصوير مستندات المعلم من الهاتف مباشرة أو اختيار صور من المعرض. استيراد Excel لا يحذف مستندات المعلمين الحاليين.</p></div>`}
function filteredTeachers(){let search=searchText.trim().toLocaleLowerCase();let filter=el('filter')?.value||'all';return teachers.filter(t=>{if(search&&!`${t.full_name} ${t.national_id} ${t.position}`.toLocaleLowerCase().includes(search))return false;let n=filled(t.id);return filter==='all'||(filter==='complete'&&n===5)||(filter==='incomplete'&&n<5)||(filter==='empty'&&n===0)}).sort((a,b)=>a.full_name.localeCompare(b.full_name,'ar'))}
function renderTeacherTable(){let list=filteredTeachers();let rows=list.slice(0,100).map(t=>{let n=filled(t.id);return `<tr><td><b>${esc(t.full_name)}</b><div class="small muted">${esc(t.national_id)}</div></td><td>${esc(t.position)}</td><td><span class="tag ${n<5?'bad':''}">${n}/5 ${n===5?'مكتمل':'غير مكتمل'}</span></td><td><button class="btn sm primary" onclick="openTeacher('${t.id}')">فتح الملف</button></td></tr>`}).join('');el('matchCount').textContent=`النتائج: ${list.length} (عرض أول 100)`;el('teacherRows').innerHTML=rows||'<tr><td colspan="4">لا توجد نتائج</td></tr>'}
function openTeacher(id){pickedTeacher=id;render()}
function renderTeacherDetails(){let t=teachers.find(x=>x.id===pickedTeacher);if(!t){pickedTeacher=null;render();return}let n=filled(t.id);let cards=Object.entries(kinds).map(([kind,title])=>{let d=docFor(t.id,kind),buttons=d?`<button class="btn sm outline" onclick="openPdf('${d.id}')">عرض PDF</button><button class="btn sm secondary" onclick="getFile('/api/documents/${d.id}/pdf?download=1')">تنزيل</button>`:'';if(user.role!=='viewer')buttons+=`<button class="btn sm primary" onclick="photo('${kind}','${d?'append':'replace'}',null,'camera')">📷 ${d?'إضافة صفحة':'تصوير'}</button><button class="btn sm secondary" onclick="photo('${kind}','${d?'append':'replace'}',null,'gallery')">صور متعددة</button>`;if(d){buttons+=`<button class="btn sm secondary" onclick="photo('${kind}','replace',null,'camera')">إعادة تصوير المستند</button><button class="btn sm secondary" onclick="replacePage('${d.id}')">استبدال صفحة</button>`;if(user.role==='admin')buttons+=`<button class="btn sm danger" onclick="deletePage('${d.id}')">حذف صفحة</button><button class="btn sm danger" onclick="deleteDoc('${d.id}')">حذف PDF</button>`}return `<div class="doc ${d?'ready':''}"><div class="between"><div class="doc-title">${d?'✅':'📄'} ${title}</div><span class="tag ${d?'':'bad'}">${d?d.pages+' صفحة':'غير مرفوع'}</span></div><p class="muted small">${d?'محفوظ داخل أرشيف المعلم':'المستند مطلوب لإكمال الملف'}</p><div class="actionrow">${buttons}</div></div>`}).join('');el('view').innerHTML=`<div class="between"><button class="btn secondary" onclick="pickedTeacher=null;render()">→ رجوع للمعلمين</button><div class="flex">${user.role==='admin'?`<button class="btn sm outline" onclick="editTeacherModal('${t.id}')">تعديل بيانات المعلم</button><button class="btn sm danger" onclick="deleteTeacher('${t.id}')">حذف المعلم</button>`:''}</div></div><div class="card" style="margin-top:13px"><div class="between"><div><h2 style="margin:0">${esc(t.full_name)}</h2><span class="muted">رقم وطني: ${esc(t.national_id)} • ${esc(t.position)}</span></div><span class="tag ${n<5?'bad':''}">${n}/5 مستندات</span></div><div class="progress" style="margin:14px 0"><div style="width:${n*20}%"></div></div><div class="flex"><button class="btn dark" onclick="getFile('/api/teachers/${t.id}/combined.pdf')" ${n?'':'disabled'}>تنزيل PDF كامل</button><button class="btn secondary" onclick="getFile('/api/teachers/${t.id}/archive.zip')" ${n?'':'disabled'}>تنزيل مجلد المعلم ZIP</button></div></div><h3>المسوغات المطلوبة</h3><div class="docgrid">${cards}</div><div class="card small muted">كل وثيقة تُحفظ PDF مستقلًا. يمكنك تصوير عدة صفحات للوثيقة، وإضافة صفحة لاحقًا، واستبدال الصفحات غير الواضحة. قص الورقة وتحسين التباين آليان عندما يمكن تحديد حدودها.</div>`}
function addTeacherModal(id){showModal('إضافة معلم',`<form id="teacherForm"><div class="field"><label>الاسم الكامل</label><input name="full_name" required></div><div class="field"><label>الرقم الوطني</label><input name="national_id" inputmode="numeric" required></div><div class="field"><label>الوظيفة</label><input name="position" required></div><button class="btn primary full">حفظ المعلم</button></form>`);el('teacherForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/teachers',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});closeModal();await refresh();notify('تم إضافة المعلم')}catch(e){notify(e.message,true)}}}
function editTeacherModal(id){let t=teachers.find(x=>x.id===id);showModal('تعديل بيانات المعلم',`<form id="teacherForm"><div class="field"><label>الاسم الكامل</label><input name="full_name" value="${esc(t.full_name)}" required></div><div class="field"><label>الرقم الوطني</label><input name="national_id" inputmode="numeric" value="${esc(t.national_id)}" required></div><div class="field"><label>الوظيفة</label><input name="position" value="${esc(t.position)}" required></div><button class="btn primary full">حفظ التعديل</button></form>`);el('teacherForm').onsubmit=async e=>{e.preventDefault();try{await api(`/api/teachers/${id}`,{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();await refresh();notify('تم تعديل البيانات')}catch(err){notify(err.message,true)}}}
async function deleteTeacher(id){if(!confirm('تحذير: سيُحذف المعلم وجميع مستنداته نهائيًا. هل تؤكد؟'))return;if(!confirm('تأكيد أخير: لا يمكن التراجع عن حذف ملفات PDF.'))return;try{await api(`/api/teachers/${id}`,{method:'DELETE'});pickedTeacher=null;await refresh();notify('تم حذف المعلم')}catch(e){notify(e.message,true)}}
async function importExcel(e){let file=e.target.files[0];e.target.value='';if(!file)return;if(!confirm('استيراد ملف Excel؟ سيُحدّث بيانات المعلمين المتطابقة أرقامهم الوطنية دون حذف صورهم.'))return;let form=new FormData();form.append('file',file);notify('جاري استيراد Excel...');try{let x=await api('/api/teachers/import',{method:'POST',body:form});await refresh();notify(`تم استيراد/تحديث ${x.count} معلم`)}catch(err){notify(err.message,true)}}
function photo(kind,mode,page,source){targetKind=kind;targetMode=mode;targetPage=page;pending.forEach(p=>URL.revokeObjectURL(p.url));pending=[];el(source).click()}
function picked(e){for(let file of e.target.files){if(file.type.startsWith('image/'))pending.push({file,angle:0,url:URL.createObjectURL(file)})}e.target.value='';if(pending.length)showPreview()}
function showPreview(){let list=pending.map((p,i)=>`<div class="thumb"><img src="${p.url}" style="transform:rotate(${p.angle}deg)"><div class="small">صفحة ${i+1}</div><button class="btn sm secondary" onclick="rotateImage(${i})">↻ تدوير</button><button class="btn sm danger" onclick="discardImage(${i})">حذف</button></div>`).join('');showModal('مراجعة صور '+kinds[targetKind],`<p class="muted">راجع وضوح الكتابة قبل الحفظ. المنظومة تضبط حدود الورقة إن أمكن وتُحسن التباين، لكنها لا تستعيد التفاصيل غير الواضحة من صورة مهزوزة.</p><div class="thumbs">${list}</div><div class="flex"><button class="btn secondary" onclick="el('camera').click()">📷 صورة أخرى</button><button class="btn secondary" onclick="el('gallery').click()">+ صور المعرض</button></div><br><button id="saveScan" class="btn primary full" onclick="uploadPending()">تحسين وتحويل إلى PDF وحفظ (${pending.length} صور)</button>`)}
function rotateImage(i){pending[i].angle=(pending[i].angle+90)%360;showPreview()}
function discardImage(i){URL.revokeObjectURL(pending[i].url);pending.splice(i,1);if(pending.length)showPreview();else closeModal()}
async function convertPhoto(p){let img=new Image();img.src=p.url;await img.decode();let w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,2400/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);let rotated=p.angle%180!==0;let canvas=document.createElement('canvas');canvas.width=rotated?h:w;canvas.height=rotated?w:h;let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(p.angle*Math.PI/180);ctx.drawImage(img,-w/2,-h/2,w,h);let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.88));if(!blob)throw Error('تعذر معالجة الصورة');return blob}
async function uploadPending(){if(busy||!pending.length)return;busy=true;let b=el('saveScan');b.disabled=true;b.innerHTML='<span class="spinner"></span> جاري تحسين الصور وحفظها...';try{let f=new FormData();for(let p of pending)f.append('images',await convertPhoto(p),'scan.jpg');f.append('mode',targetMode);let url=targetPage!==null?`/api/documents/${targetPage.id}/pages/${targetPage.index}/replace`:`/api/teachers/${pickedTeacher}/documents/${targetKind}`;let x=await api(url,{method:'POST',body:f});pending.forEach(p=>URL.revokeObjectURL(p.url));pending=[];closeModal();await refresh();notify(`تم حفظ PDF بنجاح — ${x.document.pages} صفحة${x.auto_crop_count?'، وتم قص '+x.auto_crop_count+' صورة تلقائيًا':''}`)}catch(e){notify(e.message,true);if(b){b.disabled=false;b.textContent='إعادة محاولة الحفظ'}}finally{busy=false}}
function replacePage(id){let doc=docs.find(d=>d.id===id);if(!doc)return;let p=prompt(`رقم الصفحة التي تريد استبدالها (من 1 إلى ${doc.pages}):`);if(p===null)return;let i=Number(p)-1;if(!Number.isInteger(i)||i<0||i>=doc.pages){notify('رقم الصفحة غير صحيح',true);return}photo(doc.kind,'replace',{id,index:i},'camera')}
async function deletePage(id){let d=docs.find(d=>d.id===id);let p=prompt(`أدخل رقم الصفحة المراد حذفها (1 إلى ${d.pages}):`);if(p===null)return;let i=Number(p)-1;if(!Number.isInteger(i)||i<0||i>=d.pages)return notify('رقم غير صحيح',true);if(!confirm('هل تؤكد حذف هذه الصفحة نهائيًا؟'))return;try{await api(`/api/documents/${id}/pages/${i}`,{method:'DELETE'});await refresh();notify('تم حذف الصفحة')}catch(e){notify(e.message,true)}}
async function deleteDoc(id){if(!confirm('هل تريد حذف ملف PDF كاملًا؟ لا يمكن التراجع.'))return;try{await api(`/api/documents/${id}`,{method:'DELETE'});await refresh();notify('تم حذف PDF')}catch(e){notify(e.message,true)}}
function openPdf(id){window.open(`/api/documents/${id}/pdf`,'_blank','noopener')}
function getFile(url){window.location.href=url}
function showModal(title,html){el('modalTitle').textContent=title;el('modalBody').innerHTML=html;el('modalLayer').classList.remove('hidden')}
function closeModal(){el('modalLayer').classList.add('hidden');el('modalBody').innerHTML=''}
function date(s){return s?new Date(s).toLocaleString('ar-LY',{dateStyle:'short',timeStyle:'short'}):''}
function renderUsers(){if(user.role!=='admin')return tab('home');let list=users.map(u=>`<tr><td><b>${esc(u.full_name)}</b><div class="small muted">${esc(u.username)}</div></td><td>${u.role==='admin'?'مسؤول':u.role==='scanner'?'مستخدم تصوير':'عرض فقط'}</td><td><span class="tag ${u.active?'':'bad'}">${u.active?'نشط':'معطل'}</span></td><td><div class="flex"><button class="btn sm secondary" onclick="changePassword('${u.id}')">تغيير كلمة المرور</button>${u.id!==user.id?`<button class="btn sm outline" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'تعطيل':'تفعيل'}</button><button class="btn sm secondary" onclick="changeRole('${u.id}','${u.role}')">الصلاحية</button>`:''}</div></td></tr>`).join('');el('view').innerHTML=`<div class="between"><h2 class="section-title">حسابات المستخدمين والصلاحيات</h2><button class="btn primary" onclick="userModal()">+ إنشاء مستخدم</button></div><div class="card"><p class="muted">المسؤول: جميع الصلاحيات • مستخدم التصوير: إضافة المعلمين والتصوير والتعديل دون الحذف • عرض فقط: قراءة وتنزيل الأرشيف.</p><div class="list"><table class="table"><thead><tr><th>المستخدم</th><th>النوع</th><th>الحالة</th><th>الإدارة</th></tr></thead><tbody>${list}</tbody></table></div></div>`}
function userModal(){showModal('إنشاء حساب مستخدم',`<form id="userForm"><div class="field"><label>الاسم الكامل</label><input name="full_name" required></div><div class="field"><label>اسم الدخول (إنجليزي)</label><input name="username" pattern="[A-Za-z0-9_.-]{3,40}" required></div><div class="field"><label>كلمة المرور (10 خانات على الأقل)</label><input type="password" name="password" minlength="10" required></div><div class="field"><label>الصلاحية</label><select name="role"><option value="scanner">تصوير وإضافة وتعديل</option><option value="viewer">عرض فقط</option><option value="admin">مسؤول كامل</option></select></div><button class="btn primary full">إنشاء الحساب</button></form>`);el('userForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();await refresh();notify('تم إنشاء المستخدم')}catch(err){notify(err.message,true)}}}
async function toggleUser(id,active){if(!confirm(active?'تفعيل الحساب؟':'تعطيل الحساب؟'))return;try{await api(`/api/users/${id}`,{method:'PATCH',body:JSON.stringify({active})});await refresh();notify('تم تحديث الحساب')}catch(e){notify(e.message,true)}}
async function changeRole(id,old){let r=prompt('الصلاحية الجديدة: admin أو scanner أو viewer',old);if(r===null)return;if(!['admin','scanner','viewer'].includes(r))return notify('صلاحية غير صحيحة',true);try{await api(`/api/users/${id}`,{method:'PATCH',body:JSON.stringify({role:r})});await refresh();notify('تم تغيير الصلاحية')}catch(e){notify(e.message,true)}}
async function changePassword(id){let p=prompt('كلمة مرور جديدة (10 خانات على الأقل):');if(p===null)return;if(p.length<10)return notify('كلمة مرور قصيرة',true);try{await api(`/api/users/${id}`,{method:'PATCH',body:JSON.stringify({password:p})});notify('تم تغيير كلمة المرور')}catch(e){notify(e.message,true)}}
function renderExports(){let count=teachers.length;el('view').innerHTML=`<h2 class="section-title">تصدير الأرشيف للهاتف</h2><div class="card"><h3>تنزيل ملف معلم واحد</h3><p>افتح ملف المعلم من قائمة المعلمين، ثم اختَر <b>PDF كامل</b> أو <b>مجلد المعلم ZIP</b> (بداخله المستندات الخمسة كل واحد PDF منفصل).</p><button class="btn primary" onclick="tab('teachers')">البحث عن المعلم</button></div>${user.role==='admin'?`<div class="card"><h3>تصدير جميع المعلمين دفعة واحدة</h3><p class="muted">كل معلم في مجلد باسمه وآخر 4 أرقام من رقمه الوطني، وبداخل المجلد مستندات PDF المنفصلة. سيُحفظ ملف ZIP في تنزيلات هاتفك؛ فك ضغطه لإظهار المجلدات.</p><p>الإجمالي: <b>${count}</b> معلم</p><div class="grid2"><div class="field"><label>بداية التصدير (من المعلم رقم)</label><input type="number" id="zipStart" value="1" min="1" max="${Math.max(1,count)}"></div><div class="field"><label>عدد المعلمين في هذه الدفعة</label><select id="zipCount"><option value="20">20 معلمًا (سريع)</option><option value="50" selected>50 معلمًا</option><option value="100">100 معلم</option><option value="400">الجميع حتى 400</option></select></div></div><button class="btn dark" onclick="exportBatch()">تنزيل ZIP</button><p class="small muted">لأفضل سرعة على الهاتف استخدم دفعات من 20 أو 50 معلمًا. تنزيل 400 ملف دفعة واحدة قد يحتاج وقتًا ومساحة تخزين.</p></div>`:''}`}
function exportBatch(){let start=Math.max(0,Number(el('zipStart').value)-1),count=Number(el('zipCount').value);if(start>=teachers.length)return notify('رقم البداية أكبر من عدد المعلمين',true);getFile(`/api/export.zip?start=${start}&count=${count}`);notify('بدأ تنزيل أرشيف ZIP؛ انتظر اكتمال التنزيل في المتصفح')}
boot();
</script>
</body>
