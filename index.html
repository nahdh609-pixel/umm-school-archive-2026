/* تحديث 2026: عرض بطاقات على الهاتف وفلترة بأزرار قصيرة */
.filterchips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}
.filterchips button{border:1px solid #cee1e6;background:#eff6f8;padding:9px 13px;border-radius:22px;color:#245268;font-weight:700;min-height:40px}
.filterchips button.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
.teacherlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.teacheritem{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:9px}
.teacheritem .name{font-size:16px;font-weight:800;word-break:break-word}
.teacheritem .sub{font-size:12px;color:var(--muted)}
.scan-tip{padding:10px 13px;border-radius:10px;background:#f1f8f7;border:1px solid #d4eae4;color:#245e53;margin:8px 0 12px}

/* V6: four draggable paper corners work on Android touch screens. */
.crop-area{position:relative;width:100%;max-width:520px;margin:12px auto;background:#1c2930;touch-action:none;user-select:none}
.crop-area img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.crop-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crop-handle{position:absolute;width:32px;height:32px;border-radius:50%;border:3px solid white;background:#079a95;box-shadow:0 1px 8px #0009;transform:translate(-50%,-50%);touch-action:none;cursor:grab;z-index:2}
.crop-handle:active{background:#efb328;cursor:grabbing}
.crop-note{padding:10px 12px;background:#eef9f6;border-radius:9px;color:#21594e;margin:10px 0}
.thumb .crop-badge{display:block;background:#d9f4e7;border-radius:6px;color:#17624d;margin:3px 0;font-size:11px}

/* V7: names, missing documents, and automatic paper outline */
.missing-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px;border:1px solid #dce6eb;border-radius:12px;margin:8px 0;background:#fbfdff}
.missing-row .mname{font-size:15px;font-weight:800;color:#0b243b}
.missing-row .details{font-size:12px;color:#9a5a20;margin-top:4px;line-height:1.8}
.missing-row button{flex-shrink:0}
.log-teacher{display:block;font-weight:800;font-size:15px;color:#0b243b;margin:4px 0}
.log-text{font-size:12px;color:#536977}
.auto-crop-note{font-size:11px;border-radius:7px;padding:4px 7px;background:#def4ea;color:#14604d;margin-top:4px}
@media(max-width:650px){.missing-row{align-items:center}.missing-row button{padding:8px 9px}}

/* V8: calm, usable notification and export UI on Android. */
.event-badge{display:inline-block;background:#e24749;color:white;border-radius:12px;min-width:20px;padding:0 6px;margin-right:4px;font-size:11px}
.event-card{background:#fff;border:1px solid #dde6eb;border-right:4px solid #0b9c96;border-radius:13px;padding:13px;margin-bottom:10px}

.event-title{font-weight:800;font-size:16px;margin-bottom:3px}
.event-meta{font-size:12px;color:#617484;margin-bottom:8px}
.export-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0 14px}
.export-metric{padding:11px 5px;background:#f2f7fa;border-radius:10px;border:1px solid #e0e9ed;text-align:center;cursor:pointer;color:var(--text)}.export-metric:focus-visible{outline:3px solid var(--teal);outline-offset:2px}.export-metric:hover{background:#e1f5f2}

.batch-note{padding:12px;border:1px solid #badbd6;background:#eff9f6;border-radius:12px;margin:12px 0}
.previous-select{max-height:320px;overflow-y:auto;border:1px solid #dfe7ec;border-radius:10px;padding:8px;background:#fbfdff}

/* V8.2: official A4 teacher missing-documents report; manager only. */
#printReport{display:none}
#printReport .report-title{font-size:19px;font-weight:800;margin:8px 0;text-align:center}
#printReport .report-subtitle{text-align:center;margin:0 0 10px}

<body>
<div id="loginScreen" class="shell hidden"><div class="login card center"><div class="logo">🗂️</div><h1>أرشيف شؤون المعلمين</h1><p class="muted">مدرسة أم المؤمنين للتعليم الأساسي</p><form id="loginForm" style="text-align:right"><div class="field"><label>اسم المستخدم</label><input name="username" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input type="password" name="password" autocomplete="current-password" required></div><br><button class="btn primary full" type="submit">دخول المنظومة</button></form><p class="small muted">حسابات المستخدمين ينشئها المسؤول فقط</p></div></div>
<div id="mainScreen" class="hidden"><header class="top"><div class="topinner"><div class="brand"><span class="brand-mark">▣</span> أرشيف المعلمين <span class="version-pill">🌙 V15</span><small>مدرسة أم المؤمنين للتعليم الأساسي · الوضع الليلي</small></div><div class="flex"><span id="who" class="small"></span><button class="btn sm outline" onclick="logout()">خروج</button></div></div></header><main class="shell"><div class="nav"><button data-tab="home" class="on" onclick="tab('home')">⌂ الرئيسية</button><button data-tab="notifications" id="navNotifications" onclick="tab('notifications')">🔔 الإشعارات <span id="unreadBadge" class="event-badge hidden">0</span></button><button data-tab="teachers" onclick="tab('teachers')">▤ المعلمون</button><button data-tab="users" id="navUsers" onclick="tab('users')">♙ المستخدمون</button><button data-tab="exports" onclick="tab('exports')">⇩ التصدير</button></div><div id="view" style="margin-top:16px"></div></main><footer class="foot">الأرشيف الإلكتروني — المستندات خاصة ولا تظهر إلا للمستخدمين المصرّح لهم</footer></div>
<div id="modalLayer" class="overlay hidden"><div class="modal"><div class="between"><h2 id="modalTitle" style="margin:0"></h2><button class="btn sm secondary" onclick="closeModal()">✕ إغلاق</button></div><div id="modalBody" style="margin-top:14px"></div></div></div>
<div id="toast" class="toast hidden"></div>
<div id="printReport" lang="ar" dir="rtl" aria-hidden="true"></div>
<input id="camera" type="file" accept="image/*" capture="environment" class="hidden" onchange="picked(event)">
<input id="gallery" type="file" accept="image/*" multiple class="hidden" onchange="picked(event)">
<input id="excel" type="file" accept=".xlsx,.csv" class="hidden" onchange="importExcel(event)">
<input id="restorePdfFile" type="file" accept="application/pdf,.pdf" class="hidden" onchange="restorePdfChosen(event)">
<script>
let notificationItems=[],unreadNotifications=0,lastReadAt='',firstNotificationPoll=true,notificationsTimer=null,previouslyDownloaded=new Set(),exportPreview=null,preparedBatch=null,preparedExpectedCount=0,downloadValidated=false;
let user=null,csrf='',teachers=[],docs=[],logs=[],users=[],activeTab='home',pickedTeacher=null,pending=[],targetKind='',targetMode='append',targetPage=null,busy=false,searchText='',teacherFilter='all',expectedDocVersion=0,missingSearch='',missingLimit=35,startedMissingSearch='',startedMissingLimit=35;
let automaticCapture=false,activeScanTeacher=null;
const kinds={start:'مباشرة العمل',appointment:'قرار التعيين',birth:'شهادة الميلاد',service:'استمرارية العمل',qualification:'المؤهل العلمي'};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg,err=false){let n=el('toast');n.textContent=msg;n.style.background=err?'#922538':'#0b243b';n.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.add('hidden'),5000)}
async function api(url,opt={}){
 const headers={...(opt.headers||{})};
 if(!(opt.body instanceof FormData)&&opt.body)headers['Content-Type']='application/json';
 if(opt.method&&opt.method!=='GET')headers['X-CSRF-Token']=csrf;
 const safeRead=!opt.method||opt.method==='GET';
 for(let i=0;i<(safeRead?3:1);i++){
  try{
   const response=await fetch(url,{credentials:'same-origin',...opt,headers,cache:safeRead?'no-store':'default'});
   const data=await response.json().catch(()=>({}));
   if(response.ok)return data;
   if(response.status===401){user=null;showLogin()}
   if(safeRead&&[502,503,504].includes(response.status)&&i<2){await new Promise(r=>setTimeout(r,500*(i+1)));continue}
   const err=Error(data.error||`فشل الطلب (${response.status})`);err.status=response.status;throw err;
  }catch(err){if(safeRead&&i<2&&(err instanceof TypeError)){await new Promise(r=>setTimeout(r,500*(i+1)));continue}throw err}
 }
}
async function boot(){try{let x=await api('/api/me');user=x.user;csrf=x.csrf;showMain();await refresh()}catch(e){showLogin()}}
function showLogin(){stopNotificationPolling();el('loginScreen').classList.remove('hidden');el('mainScreen').classList.add('hidden')}
function showMain(){
  el('loginScreen').classList.add('hidden');el('mainScreen').classList.remove('hidden');
  el('who').textContent=user.full_name+(user.role==='scanner'?' • تصوير وتعديل المستندات':'');
  el('navUsers').classList.toggle('hidden',user.role!=='admin');
  el('navNotifications').classList.toggle('hidden',user.role!=='admin');
  startNotificationPolling();
  document.querySelector('[data-tab="home"]').classList.toggle('hidden',user.role==='scanner');
  document.querySelector('[data-tab="exports"]').classList.toggle('hidden',user.role==='scanner');
  document.querySelector('[data-tab="teachers"]').textContent=user.role==='scanner'?'📷 تصوير المستندات':'المعلمون والأرشيف';
  if(user.role==='scanner'||(user.role!=='admin'&&activeTab==='users'))activeTab='teachers';
}
el('loginForm').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api('/api/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});user=x.user;csrf=x.csrf;showMain();await refresh();notify('تم تسجيل الدخول')}catch(err){notify(err.message,true)}});
async function logout(){stopNotificationPolling();try{await api('/api/logout',{method:'POST'})}catch(e){}csrf='';user=null;showLogin()}
async function refresh(){let x=await api('/api/state');teachers=x.teachers;docs=x.documents;logs=x.logs;users=x.users;render()}
function docFor(t,k){return docs.find(d=>d.teacher_id===t&&d.kind===k)}
function filled(t){return Object.keys(kinds).filter(k=>docFor(t,k)).length}
function missingDocs(t){return Object.entries(kinds).filter(([k])=>!docFor(t,k)).map(([,label])=>label)}
function parseLogDetails(text){
 const s=String(text||'');const m=s.match(/معلم:\s*([^|]+)\s*\|\s*وطني:\s*([^|]+)\s*\|\s*مستند:\s*([^|]+)/);
 const id=s.match(/ID:([0-9a-f-]{36})/i);
 return m?{name:m[1].trim(),national:m[2].trim(),kind:m[3].trim(),id:id?.[1]||null}:null;
}
function missingCard(t){
 const n=filled(t.id), missing=missingDocs(t);
 return `<div class="missing-row"><div><div class="mname">${esc(t.full_name)}</div><div class="small muted">${esc(t.position)} • ${n}/5 مستندات موجودة</div><div class="details">الناقص: ${esc(missing.join('، '))}</div></div><button class="btn sm primary" onclick="tab('teachers');openTeacher('${t.id}')">فتح الملف</button></div>`;
}
function renderMissingCards(){
 const e=el('missingRows'), count=el('missingCount');if(!e)return;
 const q=missingSearch.trim().toLowerCase();
 const all=teachers.filter(t=>filled(t.id)<5).filter(t=>!q||`${t.full_name} ${t.national_id||''} ${missingDocs(t).join(' ')}`.toLowerCase().includes(q))
   .sort((a,b)=>filled(b.id)-filled(a.id)||a.full_name.localeCompare(b.full_name,'ar'));
 if(count)count.textContent=`عدد الملفات غير المكتملة في النتائج: ${all.length}`;
 e.innerHTML=all.slice(0,missingLimit).map(missingCard).join('')||'<p class="muted">لا يوجد معلمون ناقصون مطابقون للبحث.</p>';
 const more=el('missingMore');if(more)more.classList.toggle('hidden',missingLimit>=all.length);
}
function moreMissing(){missingLimit+=40;renderMissingCards()}


/* A second, independent list: files with 1-4 saved document types only. */
function renderStartedMissingCards(){
 const list=el('startedMissingRows'), counter=el('startedMissingCount');
 if(!list || user?.role!=='admin')return;
 const q=startedMissingSearch.trim().toLowerCase();
 const partial=teachers.filter(t=>{
   const n=filled(t.id);
   return n>=1&&n<=4&&(!q||`${t.full_name} ${t.national_id||''} ${t.position||''} ${missingDocs(t).join(' ')}`.toLowerCase().includes(q));
 }).sort((a,b)=>a.full_name.localeCompare(b.full_name,'ar'));
 counter.textContent=`معلمون بدأ تصوير ملفاتهم ولم يكتملوا: ${partial.length}`;
 list.innerHTML=partial.slice(0,startedMissingLimit).map(t=>{
   const count=filled(t.id);
   return `<div class="started-row"><div><div class="started-name">${esc(t.full_name)} <span class="tag bad">${count}/5</span></div><div class="started-detail">${esc(t.position||'—')}</div><div class="started-missing">الناقص: ${esc(missingDocs(t).join('، '))}</div></div><button class="btn sm primary" type="button" onclick="tab('teachers');openTeacher('${t.id}')">فتح الملف</button></div>`;
 }).join('')||'<p class="muted">لا يوجد معلمون بدأ تصوير ملفاتهم ولديهم نواقص مطابقون للبحث.</p>';
 const more=el('startedMissingMore');
 if(more) more.classList.toggle('hidden',partial.length<=startedMissingLimit);
}
function moreStartedMissing(){startedMissingLimit+=40;renderStartedMissingCards()}

/* Fresh data at print time: 0/5 excluded and 5/5 excluded.
   Kept independent from the existing all-missing report. */
async function printStartedMissingReport(){
 if(!user||user.role!=='admin') return notify('هذا الكشف للمدير فقط',true);
 const container=el('printReport');
 if(!container)return notify('تعذر تجهيز الكشف',true);
 try{
  const data=await api('/api/state');
  const sourceTeachers=Array.isArray(data.teachers)?data.teachers:[];
  const sourceDocs=Array.isArray(data.documents)?data.documents:[];
  const present=new Set(sourceDocs.map(d=>`${d.teacher_id}:${d.kind}`));
  const rows=sourceTeachers.map(t=>{
    const missing=Object.entries(kinds).filter(([kind])=>!present.has(`${t.id}:${kind}`)).map(([,label])=>label);
    return {t,missing,count:5-missing.length};
  }).filter(x=>x.count>=1&&x.count<=4).sort((a,b)=>a.t.full_name.localeCompare(b.t.full_name,'ar'));
  const stamp=new Date().toLocaleString('ar-LY',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const body=rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.t.full_name)}</td><td>${esc(x.t.position||'—')}</td><td>${x.count}/5</td><td>${esc(x.missing.join('، '))}</td></tr>`).join('');
  container.innerHTML=`
   <div class="report-school">مدرسة أم المؤمنين للتعليم الأساسي</div>
   <div class="report-title">كشف المعلمين الذين بدأ تصوير ملفاتهم ولم تكتمل</div>
   <p class="report-subtitle">المعلمون الذين لديهم من 1 إلى 4 مستندات محفوظة (مع استبعاد 0/5 و5/5)</p>
   <div class="report-meta"><span>تاريخ الطباعة: ${esc(stamp)}</span><span>عدد المعلمين في الكشف: ${rows.length}</span></div>
   <table class="report-table">
    <colgroup><col style="width:7%"><col style="width:31%"><col style="width:17%"><col style="width:10%"><col style="width:35%"></colgroup>
    <thead><tr><th>م</th><th>اسم المعلم</th><th>الوظيفة</th><th>الموجود</th><th>المستندات الناقصة</th></tr></thead>
    <tbody>${body||'<tr><td colspan="5" style="text-align:center">لا توجد حاليًا ملفات بدأ تصويرها وما زالت ناقصة.</td></tr>'}</tbody>
   </table>
   <p class="report-foot">المسوغات الخمسة المطلوبة: مباشرة العمل، قرار التعيين، شهادة الميلاد، استمرارية العمل، المؤهل العلمي.</p>`;
  window.print();
 }catch(err){notify('تعذر طباعة كشف الملفات الناقصة قيد التصوير: '+err.message,true)}
}


/* Manager-only report. Fetch fresh server state so scans saved on other devices
   are reflected immediately rather than printing a stale browser list. */
async function printMissingReport(){
 if(!user || user.role!=='admin') return notify('هذا التقرير متاح للمدير فقط',true);
 const report=el('printReport');
 if(!report) return notify('تعذر تجهيز صفحة الطباعة',true);
 try{
   const data=await api('/api/state');
   const recentTeachers=Array.isArray(data.teachers)?data.teachers:[];
   const recentDocs=Array.isArray(data.documents)?data.documents:[];
   const existing=new Set(recentDocs.map(d=>`${d.teacher_id}:${d.kind}`));
   const deficits=recentTeachers.map(t=>{
     const missing=Object.entries(kinds).filter(([kind])=>!existing.has(`${t.id}:${kind}`)).map(([,name])=>name);
     return {teacher:t,missing,available:5-missing.length};
   }).filter(item=>item.missing.length>0).sort((a,b)=>a.teacher.full_name.localeCompare(b.teacher.full_name,'ar'));
   const now=new Date().toLocaleString('ar-LY',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
   const rows=deficits.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.teacher.full_name)}</td><td>${esc(x.teacher.position||'—')}</td><td>${x.available}/5</td><td>${esc(x.missing.join('، '))}</td></tr>`).join('');
   report.innerHTML=`
     <div class="report-school">مدرسة أم المؤمنين للتعليم الأساسي</div>
     <div class="report-title">كشف نواقص مستندات المعلمين</div>
     <p class="report-subtitle">قائمة تُستخرج من سجلات الأرشيف الإلكتروني عند طلب الطباعة</p>
     <div class="report-meta"><span>تاريخ الطباعة: ${esc(now)}</span><span>عدد المعلمين ذوي النواقص: ${deficits.length}</span></div>
     <table class="report-table">
       <colgroup><col style="width:7%"><col style="width:31%"><col style="width:17%"><col style="width:10%"><col style="width:35%"></colgroup>
       <thead><tr><th>م</th><th>اسم المعلم</th><th>الوظيفة</th><th>الموجود</th><th>المستندات الناقصة</th></tr></thead>
       <tbody>${rows || '<tr><td colspan="5" style="text-align:center">جميع المعلمين مكتملو المستندات (5/5)</td></tr>'}</tbody>
     </table>
     <p class="report-foot">المستندات المطلوبة: مباشرة العمل، قرار التعيين، شهادة الميلاد، استمرارية العمل، المؤهل العلمي.</p>`;
   window.print();
 }catch(err){notify('تعذر إعداد تقرير النواقص: '+err.message,true)}
}


function tab(t){if(user?.role==='scanner'&&t!=='teachers')return;if(t==='notifications'&&user?.role!=='admin')return;activeTab=t;pickedTeacher=null;searchText='';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render()}
function render(){if(!user)return;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===activeTab));if(activeTab==='home')renderHome();if(activeTab==='notifications')renderNotifications();if(activeTab==='teachers')renderTeachers();if(activeTab==='users')renderUsers();if(activeTab==='exports')renderExports()}
function renderHome(){
 const done=teachers.filter(t=>filled(t.id)===5).length, count=docs.length;
 const latest=logs.slice(0,25).map(l=>{
  const x=parseLogDetails(l.details);
  return `<div class="rowcard"><div class="small muted">${esc(l.action)} • بواسطة ${esc(l.actor_name||'النظام')} • ${date(l.created_at)}</div>`+
   (x?`<div class="log-teacher">👤 ${esc(x.name)}</div><div class="log-text">${esc(x.kind)} — الرقم الوطني: ${esc(x.national)}</div>`+
    (x.id&&teachers.some(t=>t.id===x.id)?`<button class="btn sm secondary" onclick="tab('teachers');openTeacher('${x.id}')">فتح ملف المعلم</button>`:''):
      `<div class="log-teacher">${esc(l.details||'—')}</div>`)+`</div>`;
 }).join('')||'<p class="muted">لا توجد عمليات بعد.</p>';
 el('view').innerHTML=`<h2 class="section-title">لوحة المتابعة</h2>
 <div class="statgrid"><div class="stat"><strong>${teachers.length}</strong><span>إجمالي المعلمين</span></div><div class="stat"><strong>${done}</strong><span>ملفات مكتملة</span></div><div class="stat"><strong>${teachers.length-done}</strong><span>ملفات غير مكتملة</span></div><div class="stat"><strong>${count}</strong><span>مستندات PDF محفوظة</span></div></div>
 <div class="card" style="margin-top:16px"><div class="between"><h3 style="margin:0">🔔 إشعارات إضافة وتعديل ملفات المعلمين</h3><button class="btn sm primary" onclick="tab('notifications')">عرض الإشعارات <span class="event-badge ${unreadNotifications?'':'hidden'}">${unreadNotifications}</span></button></div><div id="homeNotifications" style="margin-top:12px">${notificationItems.slice(0,4).map(notificationCard).join('')||'<p class="muted">لا توجد إشعارات جديدة بعد.</p>'}</div></div>
 <div class="card"><div class="between"><h3 style="margin:0">📋 كشف نواقص المعلمين (الاسم والمسوغات الناقصة)</h3>${user.role==='admin'?'<button type="button" class="btn dark" onclick="printMissingReport()">🖨️ طباعة كشف النواقص</button>':''}</div>
 <p class="small muted">الطباعة تشمل جميع المعلمين غير المكتملين، حتى لو كنت تبحث حاليًا عن اسم واحد.</p>
 <div class="field"><label>البحث باسم المعلم أو رقم وطني أو اسم المستند الناقص</label>
 <input class="search" id="missingSearchInput" placeholder="ابحث في جميع المعلمين الناقصين..." value="${esc(missingSearch)}" oninput="missingSearch=this.value;missingLimit=35;renderMissingCards()"></div>
 <p class="muted small" id="missingCount"></p><div id="missingRows"></div>
 <button id="missingMore" class="btn secondary full" onclick="moreMissing()">عرض المزيد من المعلمين الناقصين</button></div>
 <div class="card" id="startedMissingCard">
  <div class="started-head"><h3 style="margin:0">📂 كشف الملفات التي بدأ تصويرها ولم تكتمل (1–4 من 5)</h3>
   <button type="button" class="btn dark" onclick="printStartedMissingReport()">🖨️ طباعة كشف الملفات الناقصة قيد التصوير</button></div>
  <p class="small muted">يُظهر فقط المعلمين الذين حُفظ لهم مستند واحد على الأقل ولم يصلوا إلى 5/5. لا يشمل ملفات 0/5 ولا الملفات المكتملة.</p>
  <div class="field"><label for="startedMissingSearchInput">ابحث باسم المعلم أو رقمه الوطني أو المستند الناقص</label>
   <input class="search" id="startedMissingSearchInput" placeholder="بحث في الملفات التي بدأ تصويرها..." value="${esc(startedMissingSearch)}" oninput="startedMissingSearch=this.value;startedMissingLimit=35;renderStartedMissingCards()"></div>
  <p class="muted small" id="startedMissingCount"></p>
  <div id="startedMissingRows"></div>
  <button type="button" id="startedMissingMore" class="btn secondary full" onclick="moreStartedMissing()">عرض المزيد</button>
 </div>
 <div class="grid2"><div class="card"><h3>📷 التصوير السريع</h3><p class="muted">اختر المعلم ثم صور المستند الناقص.</p>
 <button class="btn primary" onclick="tab('teachers')">فتح قائمة المعلمين</button></div>
 <div class="card"><h3>🕓 آخر عمليات المستخدمين — اسم المعلم واضح</h3>${latest}</div></div>`;
 renderMissingCards();
 renderStartedMissingCards();
}

function startNotificationPolling(){
 stopNotificationPolling();if(user?.role!=='admin')return;
 firstNotificationPoll=true;
 pollNotifications().catch(()=>{});
 notificationsTimer=setInterval(()=>{if(user?.role==='admin'&&!document.hidden)pollNotifications().catch(()=>{})},18000);
}
function stopNotificationPolling(){if(notificationsTimer){clearInterval(notificationsTimer);notificationsTimer=null}}
async function pollNotifications(){
 const data=await api('/api/notifications');
 if(user?.role!=='admin')return;
 const before=unreadNotifications;
 notificationItems=data.items||[];unreadNotifications=data.unread||0;lastReadAt=data.last_seen_at||'';
 const badge=el('unreadBadge');if(badge){badge.textContent=unreadNotifications>99?'99+':unreadNotifications;badge.classList.toggle('hidden',!unreadNotifications)}
 if(!firstNotificationPoll&&unreadNotifications>before&&activeTab!=='notifications'){
  const mostRecent=notificationItems[0];
  if(mostRecent)notify(`🔔 ${mostRecent.action}: ${mostRecent.teacher_name} — ${mostRecent.kind}`);
 }
 firstNotificationPoll=false;
 if(activeTab==='notifications'){if(el('notificationList')){const n=el('unreadCount');if(n)n.textContent=unreadNotifications;const mark=el('markNotifications');if(mark)mark.disabled=!unreadNotifications;filterNotifications()}else renderNotifications();}
 // Refresh only the small notification preview so teacher searches don't reset.
 const slot=el('homeNotifications');if(slot)slot.innerHTML=notificationItems.slice(0,4).map(notificationCard).join('')||'<p class="muted">لا توجد إشعارات بعد.</p>';
}
function notificationCard(e){
 const teacher=teachers.find(t=>t.id===e.teacher_id),d=teacher?Object.entries(kinds).map(([key,title])=>title===e.kind?docFor(teacher.id,key):null).find(Boolean):null;
 const canOpen=teacher&&e.teacher_id;
 const unseen=lastReadAt&&new Date(e.created_at)>new Date(lastReadAt);

async function suggestedPaperCorners(url){
 // Fast, offline detection from a small thumbnail. Never auto-crop unless confidence is high.
 const img=new Image();img.src=url;await img.decode();
 const size=320, cw=Math.round(img.naturalWidth*size/Math.max(img.naturalWidth,img.naturalHeight));
 const ch=Math.round(img.naturalHeight*size/Math.max(img.naturalWidth,img.naturalHeight));
 const c=document.createElement('canvas');c.width=cw;c.height=ch;
 const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,cw,ch);
 const bytes=ctx.getImageData(0,0,cw,ch).data;const gray=new Uint8Array(cw*ch);
 for(let i=0,j=0;i<bytes.length;i+=4,j++)gray[j]=(bytes[i]*77+bytes[i+1]*150+bytes[i+2]*29)>>8;
 const corners=[];const p=Math.max(3,Math.round(Math.min(cw,ch)*.075));
 for(const [x,y] of [[p,p],[cw-1-p,p],[cw-1-p,ch-1-p],[p,ch-1-p]]){
  let sum=0,n=0;for(let yy=Math.max(0,y-3);yy<=Math.min(ch-1,y+3);yy++)for(let xx=Math.max(0,x-3);xx<=Math.min(cw-1,x+3);xx++){sum+=gray[yy*cw+xx];n++}corners.push(sum/n);
 }
 const bg=corners.sort((a,b)=>a-b)[1];
 if(bg>140)return null; // bright/light background: don't risk chopping the text
 const threshold=Math.min(220, bg+55);const isPaper=(x,y)=>gray[y*cw+x]>threshold;
 const leftX=Math.floor(cw*.28),rightX=Math.ceil(cw*.72),topY=Math.floor(ch*.27),bottomY=Math.ceil(ch*.73);
 const rows=[];for(let y=0;y<ch;y++){let hit=0;for(let x=leftX;x<rightX;x+=3)hit+=isPaper(x,y)?1:0;rows[y]=hit/Math.ceil((rightX-leftX)/3)}
 const cols=[];for(let x=0;x<cw;x++){let hit=0;for(let y=topY;y<bottomY;y+=3)hit+=isPaper(x,y)?1:0;cols[x]=hit/Math.ceil((bottomY-topY)/3)}
 const ys=rows.map((v,i)=>v>.60?i:-1).filter(v=>v>=0),xs=cols.map((v,i)=>v>.60?i:-1).filter(v=>v>=0);
 if(ys.length<ch*.40||xs.length<cw*.40)return null;
 let y0=Math.max(0,ys[0]-4),y1=Math.min(ch-1,ys[ys.length-1]+4);
 let x0=Math.max(0,xs[0]-4),x1=Math.min(cw-1,xs[xs.length-1]+4);
 if((x1-x0)*(y1-y0)<cw*ch*.32 || x1-x0<.40*cw || y1-y0<.40*ch)return null;
 if(x0<2&&x1>cw-3&&y0<2&&y1>ch-3)return null;
 return [[x0/cw,y0/ch],[x1/cw,y0/ch],[x1/cw,y1/ch],[x0/cw,y1/ch]];
}
async function picked(e){
 const inputId=e.target.id;
 const files=Array.from(e.target.files).filter(f=>f.type.startsWith('image/'));
 e.target.value='';
 if(!files.length)return;
 for(const file of files){
   pending.push({file,angle:0,url:URL.createObjectURL(file),corners:null,auto:false});
 }
 showPreview(); // Immediately show a full-width photo, even while saving.
 const shouldAutoSave=(automaticCapture && inputId==='camera' && files.length===1 && pending.length===1);
 if(shouldAutoSave){
   // The server detects paper edges and honors EXIF orientation; no manual
   // corner selection is needed for the normal capture flow.
   automaticCapture=false;
   await uploadPending();
   return;
 }
 // Optional manual preview: suggest borders without forcing them. The employee
 // can still drag corners and rotate before pressing Save.
 const latest=pending.slice(-files.length);
 await Promise.all(latest.map(async p=>{
   try{const corners=await suggestedPaperCorners(p.url);
       if(corners){p.suggestedCorners=corners;p.auto=true}}
   catch(err){/* Manual cropping always remains available. */}
 }));
 if(!el('modalLayer').classList.contains('hidden')&&!busy)showPreview();
}

 document.querySelectorAll('#cropArea .crop-handle').forEach((h,i)=>{h.style.left=(cropDraft[i][0]*100)+'%';h.style.top=(cropDraft[i][1]*100)+'%'});
}
function acceptCrop(){
 if(cropIndex<0||!cropDraft)return;
 // Reject almost zero selection before uploading.
 const p=cropDraft;const area=Math.abs(p.reduce((s,v,i)=>s+v[0]*p[(i+1)%4][1]-v[1]*p[(i+1)%4][0],0))/2;
 if(area<.015){notify('حدد مساحة الورقة كاملة، المنطقة صغيرة جدًا',true);return}
 pending[cropIndex].corners=cropDraft.map(v=>v.slice());pending[cropIndex].auto=false;cropDraft=null;showPreview();
}
function rotatedCorners(corners,angle){
 if(!corners)return null;
 return corners.map(([x,y])=>{if(angle===90)return [1-y,x];if(angle===180)return [1-x,1-y];if(angle===270)return [y,1-x];return [x,y]});
}
async function convertPhoto(p){
 // A ready-to-upload JPEG needs no canvas re-encoding if no rotation is asked.
 if(p.angle===0&&p.file.type==='image/jpeg'&&p.file.size<=1800000&&!p.corners)return p.file;
 const img=new Image();img.src=p.url;await img.decode();
 let w=img.naturalWidth,h=img.naturalHeight;
 // Send legible camera resolution but avoid slow mobile uploads of 8–12 MB.
 const s=Math.min(1,2300/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
 const sideways=p.angle%180!==0;
 const canvas=document.createElement('canvas');canvas.width=sideways?h:w;canvas.height=sideways?w:h;
 const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(p.angle*Math.PI/180);
 ctx.drawImage(img,-w/2,-h/2,w,h);
 let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.84));
 if(!blob)throw Error('تعذر تجهيز الصورة');
 if(blob.size>12*1024*1024)blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.78));
 if(!blob||blob.size>12*1024*1024)throw Error('الصورة كبيرة جدًا. التقط صورة أقرب أو اختر صورة أخرى');
 return blob;
}
// Refresh the document's tiny version record before uploading a camera image.
// This prevents false "edited by another device" errors caused by an old tab.
async function reconcileBeforeSave(){
 const latest=await api(`/api/teachers/${pickedTeacher}/documents/${targetKind}/version`);
 const previous=expectedDocVersion;
 if(targetPage!==null){
   if(!latest.exists||latest.id!==targetPage.id||latest.version!==previous){
     throw Error('تغيّرت صفحات هذا المستند أثناء التصوير. صورك ما زالت في الشاشة؛ راجع الملف ثم اختر الصفحة الصحيحة قبل استبدالها.');
   }
 }else if(targetMode==='replace'&&latest.version!==previous){
   if(previous===0&&latest.exists){
     if(!confirm('المستند أُضيف من جهاز آخر أثناء التصوير.\nاضغط موافق لإضافة صورتك كصفحة جديدة دون حذف ما صوّره زميلك.\nأو إلغاء للاحتفاظ بالصورة دون حفظ.'))return false;
     targetMode='append';  // Only non-destructive option for unexpected new file.
   }else if(previous>0&&latest.exists){
     if(!confirm('هذا المستند تغيّر بعد فتح الكاميرا.\nاضغط موافق إذا كنت تريد استبدال النسخة الحالية بصورة جديدة، أو إلغاء للاحتفاظ بصورك دون حفظ.'))return false;
   }else if(previous>0&&!latest.exists){
     if(!confirm('حُذف هذا المستند من جهاز آخر.\nهل تريد إنشاء مستند جديد بالصورة الموجودة؟'))return false;
   }
 }
 expectedDocVersion=latest.version;
 return true;
}
async function uploadPending(){
 if(busy||!pending.length)return;
 busy=true;const b=el('saveScan');if(!b){busy=false;return;}b.disabled=true;b.textContent='تجهيز الصور...';
 const status=el('previewStatus');if(status)status.innerHTML='<span class="spinner"></span> جاري تجهيز الصورة وحفظها تلقائيًا...';
 try{
  b.textContent='التحقق من أحدث نسخة...';
  if(!(await reconcileBeforeSave())){
    b.disabled=false;b.textContent='حفظ المستند PDF';return;
  }
  const f=new FormData();const quality=el('scanQuality')?.value||'scan';const crop=[];
  for(let i=0;i<pending.length;i++){
   b.textContent=`تجهيز ${i+1} من ${pending.length}...`;
   const p=pending[i];const blob=await convertPhoto(p);
   f.append('images',blob,`page-${i+1}.jpg`);
   crop.push(rotatedCorners(p.corners,p.angle));
  }
  f.append('crop_points',JSON.stringify(crop));
  f.append('mode',targetMode);f.append('quality',quality);
  f.append('expected_version',String(expectedDocVersion));
  const url=targetPage!==null?`/api/documents/${targetPage.id}/pages/${targetPage.index}/replace`:`/api/teachers/${pickedTeacher}/documents/${targetKind}`;
  b.textContent='رفع الصورة وتحويلها إلى PDF...';
  const x=await api(url,{method:'POST',body:f});
  pending.forEach(p=>URL.revokeObjectURL(p.url));pending=[];
  closeModal(true);
  const idx=docs.findIndex(d=>d.id===x.document.id);
  if(idx<0)docs.push(x.document);else docs[idx]=x.document;
  render();
  notify(`✅ تم حفظ ${kinds[targetKind]} — ${x.document.pages} صفحة${x.auto_crop_count?'، قص '+x.auto_crop_count+' صورة':''}`);
  // Background sync is not part of the Save waiting time.
  setTimeout(()=>{
    if(!busy&&!pending.length&&el('modalLayer').classList.contains('hidden')){
       refresh().catch(()=>{});
    }
  },1800);
 }catch(e){
  if(e.status===409){
    notify('تم تحديث المستند من جهاز آخر أثناء الحفظ. صورتك محفوظة هنا؛ اضغط إعادة محاولة لحفظها بأمان.',false);
  }else notify(e.message,true);
  b.disabled=false;b.textContent='إعادة محاولة الحفظ';
  const status=el('previewStatus');
  if(status){status.textContent='لم يكتمل الحفظ. الصورة ما زالت محفوظة في هذه الشاشة؛ يمكنك تعديل القص ثم إعادة المحاولة.';}
 }finally{busy=false}
}

async function getFile(url){
 try{
  const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});
  if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'لم يتم تنزيل المستند');}
  const type=r.headers.get('Content-Type')||'';
  if(!type.includes('pdf')&&!type.includes('zip'))throw Error('الخادم لم يرجع ملف PDF أو ZIP صالحًا');
  const disposition=r.headers.get('Content-Disposition')||'';
  let name='teacher-file.'+(type.includes('zip')?'zip':'pdf');
  const encoded=disposition.match(/filename\*=UTF-8''([^;]+)/i);
  const simple=disposition.match(/filename="?([^";]+)"?/i);
  if(encoded){try{name=decodeURIComponent(encoded[1])}catch(err){}}
  else if(simple)name=simple[1];
  const blob=await r.blob();const address=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=address;a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(address),120000);
  notify('تم تجهيز المستند. راجع التنزيلات في هاتفك.');
 }catch(e){notify('تعذر التنزيل: '+e.message,true)}
}

function zipEntryCount(blobBytes){
 const view=new DataView(blobBytes);
 for(let i=view.byteLength-22;i>=Math.max(0,view.byteLength-65557);i--){
  if(view.getUint32(i,true)===0x06054b50){
   const comment=view.getUint16(i+20,true);
   if(i+22+comment===view.byteLength){return view.getUint16(i+10,true)}
  }
 }
 return -1;
}
async function downloadPrepared(){
 if(!preparedBatch)return;
 const b=el('startZipDownload'),message=el('downloadStatus');
 if(b){b.disabled=true;b.textContent='جارٍ إنشاء ZIP والتحقق منه…'}
 if(message)message.textContent='قد يستغرق تحميل عشرات الصور بعض الوقت؛ لا تغلق هذه الصفحة.';
 downloadValidated=false;
 try{
  const r=await fetch(`/api/export/batch/${encodeURIComponent(preparedBatch)}.zip`,{credentials:'same-origin',cache:'no-store'});
  if(!r.ok){const err=await r.json().catch(()=>({}));throw Error(err.error||`تعذر إنشاء الأرشيف: ${r.status}`)}
  const expectedTeachers=Number(r.headers.get('X-Archive-Teachers'));
  const expectedEntries=Number(r.headers.get('X-Archive-Entries'));
  const expectedPdfs=Number(r.headers.get('X-Archive-Pdfs'));
  const expectedBytes=Number(r.headers.get('Content-Length'));
  let blob;
  if(r.body && expectedBytes>0){
   const reader=r.body.getReader(),parts=[];let received=0;
   try{
    while(true){
     const {done,value}=await reader.read();
     if(done)break;
     received+=value.byteLength;
     if(received>expectedBytes)throw Error('وصلت بيانات أكثر من الحجم المتوقع، أُوقف التنزيل للحماية.');
     parts.push(value);
     if(message)message.textContent=`📥 وصول ZIP إلى الهاتف: ${Math.min(100,Math.round(100*received/expectedBytes))}% — لا تغلق الصفحة.`;
    }
   }finally{reader.releaseLock()}
   blob=new Blob(parts,{type:'application/zip'});
  }else{
   blob=await r.blob();
  }
  if(expectedTeachers!==preparedExpectedCount||expectedPdfs!==preparedExpectedZipPdfs||!expectedEntries||!expectedBytes||blob.size!==expectedBytes){
   throw Error('تنزيل غير مكتمل: عدد المعلمين أو حجم ZIP لا يطابق الكشف. لا تؤكد هذه الدفعة.')
  }
  // Check the ZIP central directory was received, not just the HTTP status.
  const tail=await blob.slice(Math.max(0,blob.size-65557)).arrayBuffer();
  const count=zipEntryCount(tail);
  if(count!==expectedEntries)throw Error('نهاية ZIP مفقودة أو عدد الملفات لا يطابق الكشف؛ أعد التنزيل.')
  const objectUrl=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=objectUrl;a.download=`${preparedBatchName}_${preparedExpectedZipPdfs}_PDF.zip`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(objectUrl),120000);
  downloadValidated=true;
  if(el('confirmZipDownload'))el('confirmZipDownload').disabled=false;
  if(message)message.textContent=`✅ تم التحقق من ZIP: ${preparedExpectedCount} معلم، ${expectedPdfs} ملف PDF، وحجمه ${(blob.size/1024/1024).toFixed(2)} MB. افتح الملف وتأكد من وصوله قبل التأكيد.`;
  notify(`تم تجهيز ZIP كاملًا لعدد ${preparedExpectedCount} معلم. افحصه داخل الهاتف قبل التأكيد.`);
 }catch(e){downloadValidated=false;if(message)message.textContent='❌ '+e.message+' — لم يتم تسجيل أي تنزيل لهذه الدفعة.';notify(e.message,true)}
 finally{if(b){b.disabled=false;b.textContent='↻ إعادة تنزيل ZIP'}}
}

// V11: ZIP-store without recompression. If the browser provides a native
// writable file picker we stream to disk; otherwise Blob fallback works for
// moderate batches but may require more memory on older Android browsers.
const fastZipEncoder=new TextEncoder();
const fastZipCrcTable=(()=>{
 const table=new Uint32Array(256);
 for(let n=0;n<256;n++){
  let c=n;for(let k=0;k<8;k++)c=(c>>>1)^(c&1?0xedb88320:0);
  table[n]=c>>>0;
 }
 return table;
})();
function fastZipCrc32(data){
 let c=0xffffffff;
 for(let i=0;i<data.length;i++)c=fastZipCrcTable[(c^data[i])&255]^(c>>>8);
 return (c^0xffffffff)>>>0;
}
function fastZipTime(){const d=new Date();return {
 time:(d.getHours()<<11)|(d.getMinutes()<<5)|Math.floor(d.getSeconds()/2),
 date:((Math.max(1980,d.getFullYear())-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()
}}
function createFastZipSink(writable){
 const chunks=[],central=[];let offset=0,entries=0,closed=false;
 const write=async data=>{if(!data?.byteLength)return;if(offset+data.byteLength>=4294967295)throw Error('حجم ZIP تجاوز حد 4GB لهذا المتصفح.');
   if(writable)await writable.write(data);else chunks.push(data);
   offset+=data.byteLength};
 const stamp=fastZipTime();
 const entry=async(name,payload)=>{
  if(closed)throw Error('تم إغلاق ZIP');
  const fileName=fastZipEncoder.encode(name);
  const data=payload instanceof Uint8Array?payload:new Uint8Array(payload);

async function fetchDirectPdf(item){
 let last='اتصال غير مستقر';
 for(let attempt=0;attempt<4;attempt++){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),90000);
  try{
   const response=await fetch(item.url,{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',signal:ctrl.signal});
   if(!response.ok){last=`HTTP ${response.status}`;
    if([400,401,403,404,410].includes(response.status))break;
    throw Error(last);
   }
   const bytes=new Uint8Array(await response.arrayBuffer());
   if(bytes.length<8||bytes[0]!==37||bytes[1]!==80||bytes[2]!==68||bytes[3]!==70||bytes[4]!==45){

   }
   return {item,bytes};
  }catch(err){last=err.name==='AbortError'?'انتهت مهلة الاتصال':(err.message||'فشل الاتصال');
   if(attempt<3)await sleepFast(500*Math.pow(2,attempt));
  }finally{clearTimeout(timer)}
 }
 return {item,error:last};
}

 }catch(err){
  if(sink)await sink.abort();

    v15Timers[i]=setInterval(()=>v15Poll(i),4000);
 }catch(e){v15Stop(i);if(b){b.disabled=false;b.textContent='📦 تجهيز الملف على Render'}
   v15Status(i,'❌ '+e.message);notify(e.message,true)}
}
function v15Download(i){
 const part=v13Groups[i];if(!part?.batch_id||!v15Ready.has(i))return notify('جهز الملف أولًا.',true);
 const a=document.createElement('a');a.href=`/api/export/batch/${encodeURIComponent(part.batch_id)}/render/download`;
 a.rel='nofollow';document.body.appendChild(a);a.click();a.remove();
 v15Status(i,'📥 بدأ تنزيل الملف من Render إلى Chrome. افتح التنزيلات وتأكد أنه وصل كاملًا قبل التأكيد.');
}
// V14: reusable R2 cache for each of the three ZIP parts OR the one merged PDF.
// The browser never receives R2 credentials, only a temporary signed GET link.
let v14Timers={},v14Polling=new Set(),v14Ready=new Set();
function v14StopAll(){Object.values(v14Timers).forEach(clearInterval);v14Timers={};v14Polling.clear();v14Ready.clear()}
function v14Status(i,message){const n=el('v13Status-'+i);if(n)n.textContent=message}
function v14Stop(i){if(v14Timers[i]){clearInterval(v14Timers[i]);delete v14Timers[i]}}
async function v14Poll(i){
 if(v14Polling.has(i))return;
 const part=v13Groups[i];if(!part?.batch_id){v14Stop(i);return}
 v14Polling.add(i);
 try{
  const x=await api(`/api/export/batch/${encodeURIComponent(part.batch_id)}/ready/status`);
  const build=el('v14Build-'+i),link=el('v14Link-'+i);
  if(x.status==='ready'){
   v14Stop(i);v14Ready.add(i);
   if(build){build.disabled=false;build.textContent='✓ الملف جاهز في التخزين'}
   if(link)link.classList.remove('hidden');
   v14Status(i,`✅ جاهز للتنزيل المباشر • ${(Number(x.bytes||0)/1048576).toFixed(1)} ميغابايت • المستندات: ${x.pdfs??'انظر الكشف'} • غير المتاحة: ${x.missing??'انظر الكشف'}. اضغط تنزيل مباشر.`);
   return 'ready';
  }else if(x.status==='failed'||x.status==='not_started'){
   v14Stop(i);if(build){build.disabled=false;build.textContent='↻ إعادة تجهيز الدفعة'}
   v14Status(i,'❌ '+(x.message||'لم يكتمل التجهيز')+'؛ لا تغيّر ملفات الأرشيف.');
   return 'failed';
  }else v14Status(i,'⏳ '+(x.message||'جارٍ تجهيز الدفعة. انتظر ظهور زر التنزيل المباشر.'));
 }catch(e){v14Stop(i);const b=el('v14Build-'+i);if(b)b.disabled=false;v14Status(i,'تعذر قراءة حالة التجهيز: '+e.message)}
 finally{v14Polling.delete(i)}
}
async function v14Start(i){
 const part=v13Groups[i];if(!part?.batch_id)return notify('لا توجد مستندات في هذا الجزء',true);
 v14Stop(i);v14Ready.delete(i);
 const b=el('v14Build-'+i),link=el('v14Link-'+i);
 if(b){b.disabled=true;b.textContent='⏳ جارٍ تجهيز نسخة التنزيل...'}
 if(link)link.classList.add('hidden');
 try{
  const x=await api(`/api/export/batch/${encodeURIComponent(part.batch_id)}/ready/start`,{method:'POST',body:'{}'});
  v14Status(i,x.message||'بدأ تجهيز الملف في التخزين الخاص');
  const state=await v14Poll(i);
  if(state!=='failed' && !v14Ready.has(i) && !v14Timers[i])v14Timers[i]=setInterval(()=>v14Poll(i),4000);
 }catch(e){if(b){b.disabled=false;b.textContent='📦 تجهيز نسخة التنزيل المباشر'}v14Status(i,'❌ '+e.message);notify(e.message,true)}
}
async function v14Link(i){
 const part=v13Groups[i];if(!part?.batch_id||!v14Ready.has(i))return notify('جهّز الدفعة أولًا',true);
 try{
  const x=await api(`/api/export/batch/${encodeURIComponent(part.batch_id)}/ready/link`);
  // Navigate to private time-limited R2 GET, not through a Render response body.
  window.location.assign(x.url);
  v14Status(i,'📥 بدأ تنزيل الملف من R2. افتح تنزيلات Chrome وتأكد من وصوله كاملًا قبل الضغط على التأكيد.');
 }catch(e){notify(e.message,true);v14Status(i,'❌ '+e.message)}
}

function v13Download(i){
 const part=v13Groups[i];if(!part?.batch_id)return notify('هذه الدفعة غير موجودة',true);
 const url=v13Mode!=='single_pdf'?
  `/api/export/batch/${encodeURIComponent(part.batch_id)}/available.zip`:
  `/api/export/v13/batch/${encodeURIComponent(part.batch_id)}/all-teachers.pdf`;
 const a=document.createElement('a');a.href=url;a.download='';a.rel='nofollow';
 document.body.appendChild(a);a.click();a.remove();
 const node=el('v13Status-'+i);
 if(node)node.textContent='بدأ طلب التنزيل في Chrome. افتح التنزيلات وانتظر اكتماله وافحص محتوياته؛ لا تؤكد قبل ذلك.';
}
async function v13Confirm(i){
 const part=v13Groups[i];if(!part?.batch_id)return;
 const label=v13Mode==='single_pdf'?'ملف PDF الواحد':'ZIP الخاص بهذه الدفعة';
 const b=el('v13Confirm-'+i),node=el('v13Status-'+i);
 if(b)b.disabled=true;
 try{
  const check=await api(`/api/export/v13/batch/${encodeURIComponent(part.batch_id)}/status`);
  if(!check.ready)throw Error('لم يكتمل إعداد قائمة المستندات المتاحة؛ نزّل الملف وانتظر اكتمال التجهيز.');
  if(check.confirmed){if(node)node.textContent='✓ سبق تأكيد هذه الدفعة';return;}
  if(!confirm(`هل وصل ${label} إلى هاتفك كاملًا وفتحته؟\nالملفات المخطط لها: ${check.expected}\nالمستندات المضمّنة فعلًا: ${check.delivered}\nالمتعذرة: ${check.unavailable}\nالمتعذرة لا تُحسب منزّلة.`))return;
  const result=await api('/api/export/confirm-available',{method:'POST',body:JSON.stringify({batch_id:part.batch_id})});
  if(node)node.textContent=`✅ تم تأكيد ${result.count||0} مستند صالح فقط؛ الباقي يظل مطلوبًا. لا يتكرر تأكيده.`;
  notify(`✅ تم تأكيد الجزء: ${result.count||0} مستند`);
  if(b){b.textContent='✓ تم تأكيد هذا الجزء';b.disabled=true}
 }catch(e){notify(e.message,true);if(node)node.textContent='❌ '+e.message;if(b)b.disabled=false}
}

// V12: build a private ready-to-download ZIP once and fetch it directly from R2.
// Existing V11 phone-side ZIP is preserved as a fallback, untouched.
let cachedPollTimer=null;
let cachedReady=false;
function cachedSetStatus(s){const e=el('cachedStatus');if(e)e.textContent=s}
function cachedStopPolling(){if(cachedPollTimer){clearInterval(cachedPollTimer);cachedPollTimer=null}}
async function cachedPollOnce(){
 if(!preparedBatch){cachedStopPolling();return}
 let info=await api(`/api/export/batch/${encodeURIComponent(preparedBatch)}/ready/status`);
 if(info.status==='ready'){
  cachedStopPolling();cachedReady=true;
  const n=el('cachedDownloadButton');if(n)n.classList.remove('hidden');
  const c=el('cachedConfirmButton');if(c)c.classList.remove('hidden');
  cachedSetStatus(`✅ ZIP جاهز • ${(Number(info.bytes||0)/1048576).toFixed(1)} MB • عدد PDF: ${info.pdfs??'راجع الكشف'} • المتعذر: ${info.missing??'راجع الكشف'}. اضغط تنزيل.`);
 }else if(info.status==='failed'){
  cachedStopPolling();cachedSetStatus('❌ '+info.message+' — الملفات الأصلية لم تتغير. يمكنك إعادة التجهيز أو استخدام V11.');
  const b=el('cachedStartButton');if(b){b.disabled=false;b.textContent='↻ إعادة تجهيز ZIP'}
 }else if(info.status==='not_started'){
  cachedStopPolling();cachedSetStatus('التجهيز لم يبدأ أو أُعيد تشغيل Render. اضغط تجهيز من جديد.');
  const b=el('cachedStartButton');if(b)b.disabled=false;
 }else{
  cachedSetStatus('⏳ '+(info.message||'جارٍ تجهيز ZIP')+'؛ يمكنك إبقاء الصفحة مفتوحة.');
 }
}
async function startCachedExport(){
 if(!preparedBatch)return notify('جهّز قائمة المعلمين أولًا',true);
 cachedReady=false;cachedStopPolling();
 const b=el('cachedStartButton');if(b){b.disabled=true;b.textContent='جارٍ إرسال الدفعة للتجهيز...'}
 const d=el('cachedDownloadButton');if(d)d.classList.add('hidden');
 const c=el('cachedConfirmButton');if(c)c.classList.add('hidden');
 try{
  const res=await api(`/api/export/batch/${encodeURIComponent(preparedBatch)}/ready/start`,{method:'POST',body:'{}'});
  cachedSetStatus(res.message||'بدأ تجهيز الملف');
  if(b)b.textContent='⏳ جارٍ تجهيز ZIP...';
  if(res.status==='ready')await cachedPollOnce();
  else{await cachedPollOnce();cachedPollTimer=setInterval(()=>cachedPollOnce().catch(e=>{cachedSetStatus(e.message)}),3500)}
 }catch(e){cachedSetStatus('❌ '+e.message);notify(e.message,true);if(b){b.disabled=false;b.textContent='📦 تجهيز ZIP في التخزين الخاص'}}
}
async function downloadCachedExport(){
 if(!preparedBatch||!cachedReady)return notify('ZIP غير جاهز بعد',true);
 try{
  const x=await api(`/api/export/batch/${encodeURIComponent(preparedBatch)}/ready/link`);
  // Direct link triggers Chrome download; no PDF bytes cross Render.
  const a=document.createElement('a');a.href=x.url;a.target='_self';a.rel='noopener noreferrer';
  document.body.appendChild(a);a.click();a.remove();
  cachedSetStatus('📥 بدأ طلب تنزيل ZIP من التخزين الخاص. افتح تنزيلات Chrome وانتظر اكتماله ثم افحص الكشف قبل التأكيد.');
 }catch(e){notify(e.message,true)}
}
async function confirmCachedExport(){
 if(!cachedReady||!preparedBatch)return notify('جهّز ZIP أولًا',true);
 // Same confirmed-per-document history as V11 (including missing file safety).
 if(!confirm('هل وصل ZIP كاملًا لهاتفك، وفتحته وراجعت كشف PDF والملفات المتعذرة؟'))return;
 cachedStopPolling();
 const b=el('cachedConfirmButton');if(b)b.disabled=true;
 try{
  const result=await api('/api/export/confirm-available',{method:'POST',body:JSON.stringify({batch_id:preparedBatch})});
  preparedBatch=null;cachedReady=false;closeModal(true);
  notify(`✅ تم تأكيد ${result.count||0} ملف PDF فقط؛ المتعذر لا يُحتسب منزّلًا.`);await refresh();
 }catch(e){notify(e.message,true);if(b)b.disabled=false}
}

boot();
</script>
